<title>NBA 2026-27 Database</title>
<style>
  /* Layout: one plain reference table with tabs, search and team filter; stacks to cards on phones. */
  :root { --bg:#ffffff; --fg:#1a1c20; --muted:#5e6470; --line:#dfe2e8; --soft:#f4f6f9; --accent:#1f4e9c; --accent-soft:#eef3fb;
          --font: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16181c; --fg:#e8eaee; --muted:#a0a6b2; --line:#2e323a; --soft:#1e2127; --accent:#8fb3f0; --accent-soft:#1f2a3d; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg:#16181c; --fg:#e8eaee; --muted:#a0a6b2; --line:#2e323a; --soft:#1e2127; --accent:#8fb3f0; --accent-soft:#1f2a3d; color-scheme: dark; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font:15px/1.45 var(--font); }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:4px 0 2px; text-wrap:balance; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:14px; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; border-bottom:1px solid var(--line); margin-bottom:12px; }
  .tabs button { border:1px solid var(--line); border-bottom:none; background:var(--soft); color:var(--fg); padding:8px 12px; font:inherit; cursor:pointer; border-radius:6px 6px 0 0; }
  .tabs button.on { background:var(--bg); font-weight:600; position:relative; top:1px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .bar input, .bar select { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  .bar input { flex:1 1 220px; min-width:0; }
  .btn { font:inherit; padding:8px 12px; border:1px solid var(--accent); color:var(--accent); background:var(--bg); border-radius:6px; cursor:pointer; text-decoration:none; }
  .btn:hover { background:var(--accent-soft); }
  button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .count { color:var(--muted); font-size:13px; margin-bottom:6px; }
  .tablebox { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; vertical-align:top; padding:8px; border-bottom:1px solid var(--line); }
  th { background:var(--soft); font-size:13px; }
  td.small { font-size:13px; color:var(--muted); white-space:nowrap; }
  a { color:var(--accent); }
  .msg { color:var(--muted); font-size:13px; min-height:18px; }
  textarea#fallback { width:100%; height:160px; font:12px/1.4 ui-monospace, Menlo, Consolas, monospace; background:var(--soft); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px; }
  @media (max-width:720px) {
    thead { display:none; }
    table, tbody, tr, td { display:block; width:100%; }
    tr { border:1px solid var(--line); border-radius:8px; margin-bottom:10px; padding:6px 4px; }
    td { border:none; padding:3px 8px; }
    td::before { content:attr(data-label) ": "; font-weight:600; color:var(--muted); }
    td.small { white-space:normal; }
    td:empty { display:none; }
  }
</style>

<div class="wrap">
  <h1>NBA 2026-27 Database</h1>
  <div class="sub" id="sub"></div>
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <input id="q" type="search" placeholder="Search a player, team, or word (example: Lakers, injured, starter)" aria-label="Search">
    <select id="team" aria-label="Team"></select>
    <button class="btn" id="copy">Copy for AI</button>
  </div>
  <div class="msg" id="msg"></div>
  <textarea id="fallback" hidden readonly aria-label="Database text"></textarea>
  <div class="count" id="count"></div>
  <div class="tablebox"><table id="tbl"><thead></thead><tbody></tbody></table></div>
</div>

<script id="dbdata" type="application/json">__DB__</script>
<script id="aitext" type="text/plain">__AI__</script>
<script>
const db = JSON.parse(document.getElementById("dbdata").textContent);
const AI = document.getElementById("aitext").textContent;
const NAMES = {ATL:"Atlanta Hawks",BOS:"Boston Celtics",BKN:"Brooklyn Nets",CHA:"Charlotte Hornets",CHI:"Chicago Bulls",CLE:"Cleveland Cavaliers",DAL:"Dallas Mavericks",DEN:"Denver Nuggets",DET:"Detroit Pistons",GSW:"Golden State Warriors",HOU:"Houston Rockets",IND:"Indiana Pacers",LAC:"LA Clippers",LAL:"Los Angeles Lakers",MEM:"Memphis Grizzlies",MIA:"Miami Heat",MIL:"Milwaukee Bucks",MIN:"Minnesota Timberwolves",NOP:"New Orleans Pelicans",NYK:"New York Knicks",OKC:"Oklahoma City Thunder",ORL:"Orlando Magic",PHI:"Philadelphia 76ers",PHX:"Phoenix Suns",POR:"Portland Trail Blazers",SAC:"Sacramento Kings",SAS:"San Antonio Spurs",TOR:"Toronto Raptors",UTA:"Utah Jazz",WAS:"Washington Wizards"};
const TABS = {
  players:  { label:"Players",  cols:[["player","Player"],["team","Team"],["role","Role"],["minutes","Minutes"],["usage","Usage"],["status","Health"],["note","Note"]] },
  rankings: { label:"Rankings", cols:[["rank","Rank"],["player","Player"],["pos","Pos"],["team","Team"],["change","Change"],["note","Note"]] },
  teams:    { label:"Teams",    cols:[["team","Team"],["starters","Projected starters"],["bench","Bench order"],["backup_c","Backup C"],["coach","Coach"],["notes","Notes"]] },
  injuries: { label:"Injuries", cols:[["player","Player"],["team","Team"],["status","Health"],["note","Note"]] },
  moves:    { label:"Moves",    cols:[["player","Player"],["from","From"],["to","To"],["type","Type"],["note","Note"]] }
};
let tab = "players";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const srcFor = r => db.sources.find(s => s.id === r.source) || null;

function rows() {
  const q = $("q").value.trim().toLowerCase(), t = $("team").value;
  return db[tab].filter(r => {
    if (t && tab !== "sources" && !(r.team === t || r.to === t || r.from === t)) return false;
    if (!q) return true;
    const extra = [r.team, r.to, r.from].map(c => NAMES[c] || "").join(" ");
    return (Object.values(r).join(" ") + " " + extra).toLowerCase().includes(q);
  });
}

function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  const cols = TABS[tab].cols, showSrc = tab !== "sources";
  $("tbl").tHead.innerHTML = "<tr>" + cols.map(c => `<th>${c[1]}</th>`).join("") + "" + "</tr>";
  const list = rows();
  $("count").textContent = `${list.length} of ${db[tab].length} rows`;
  $("tbl").tBodies[0].innerHTML = list.map(r => {
    const cells = cols.map(([k, label]) => {
      const v = k === "url" ? `<a href="${esc(r.url)}" target="_blank" rel="noopener">Watch</a>` : esc(r[k]);
      return `<td data-label="${label}">${v}</td>`;
    }).join("");
    let s = "";
    return `<tr>${cells}${s}</tr>`;
  }).join("");
}

$("copy").onclick = () => {
  navigator.clipboard.writeText(AI).then(() => {
    $("msg").textContent = "Copied the whole database as text. Paste it into any AI chat.";
  }).catch(() => {
    const ta = $("fallback"); ta.value = AI; ta.hidden = false; ta.focus(); ta.select();
    $("msg").textContent = "Your browser blocked copying, so the text is selected below. Press Ctrl+C (or Cmd+C) to copy it.";
  });
};
$("q").oninput = render;
$("team").onchange = render;

$("sub").textContent = `Updated ${db.updated} · ${db.players.length} players · ${db.teams.length} teams · projections are opinions, not official news`;
$("tabs").innerHTML = Object.entries(TABS).map(([k,v]) => `<button data-t="${k}">${v.label}</button>`).join("");
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
const teams = [...new Set(db.teams.map(t => t.team).concat(db.players.map(p => p.team)))].filter(Boolean).sort();
$("team").innerHTML = '<option value="">All teams</option>' + teams.map(t => `<option value="${t}">${t} – ${NAMES[t] || t}</option>`).join("");
render();
</script>
