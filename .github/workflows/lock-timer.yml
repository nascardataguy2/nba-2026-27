name: lock-timer
# Runs projections on time all day so no Claude sessions are needed:
# 5:30, 6:30, 7:30 AM ET (shorts ready for the 8:30 video), 8:40 AM, 12:40 and
# 4:40 PM backups, then 5:30 PM every 30 minutes until the first lock and 45, 15
# and 5 minutes before each lock. It sleeps until each time and dispatches
# projections.yml. A failed update fails the run, and GitHub emails Pearce.
# GitHub skips some scheduled starts, so there are many start times; any one is
# enough, and the extras wait in line and then find nothing left to do.
# A daily Claude task also dispatches this once as a backup.
on:
  schedule:
    - cron: "7,22,37,52 8,9 * * *"   # about 4 AM ET (summer and winter)
    - cron: "7 13,15,17 * * *"       # midday restarts in case the morning start was skipped
    - cron: "7,37 20,21 * * *"       # afternoon restarts before the lock-time updates
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: lock-timer
  cancel-in-progress: false
jobs:
  # A GitHub job stops after 6 hours, so chained jobs each cover just over
  # 5 hours and pick up whatever updates are still ahead.
  part1:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/lock_timer.py
        env:
          GH_TOKEN: ${{ github.token }}
  part2:
    needs: part1
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/lock_timer.py
        env:
          GH_TOKEN: ${{ github.token }}
  part3:
    needs: part2
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/lock_timer.py
        env:
          GH_TOKEN: ${{ github.token }}
  part4:
    needs: part3
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/lock_timer.py
        env:
          GH_TOKEN: ${{ github.token }}
  part5:
    needs: part4
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/lock_timer.py
        env:
          GH_TOKEN: ${{ github.token }}
