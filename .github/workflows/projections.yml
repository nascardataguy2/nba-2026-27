name: projections
on:
  schedule:
    - cron: "17 14 * * *"   # about 10:17 AM ET: last night's results, then today's projections
    - cron: "23 15-23 * * *" # every hour at :23 from 11:23 AM to 7:23 PM ET (GitHub often runs these late)
    - cron: "53 21,22,23 * * *" # extra runs near lock
  workflow_dispatch:
  push:
    paths: [".github/workflows/projections.yml"]
permissions:
  contents: write
concurrency: projections
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pillow
      - name: Results from last night
        if: github.event.schedule == '17 14 * * *' || github.event_name != 'schedule'
        run: python3 scripts/results.py || echo "results failed"
      - name: Projections and database
        run: |
          python3 scripts/projections.py
          python3 scripts/build.py
      - name: Commit
        run: |
          git config user.name "nascardataguy2"
          git config user.email "nascardataguy2@users.noreply.github.com"
          git add data ai.txt
          git diff --cached --quiet && exit 0
          git commit -q -m "Projections update"
          for i in 1 2 3; do
            if git pull --rebase -q && git push -q; then break; fi
            git rebase --abort 2>/dev/null || true
            git reset -q --hard origin/main
            python3 scripts/projections.py && python3 scripts/build.py
            git add data ai.txt
            git diff --cached --quiet && exit 0
            git commit -q -m "Projections update"
          done
          for f in data/projections.json data/db.json ai.txt; do curl -s "https://purge.jsdelivr.net/gh/nascardataguy2/nba-2026-27@main/$f" > /dev/null || true; done
