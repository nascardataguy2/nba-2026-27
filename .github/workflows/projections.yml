name: projections
on:
  schedule:
    # Summer times (EDT, UTC-4). The gate job skips these after the clocks change.
    - cron: "31 11 * * *"   # 7:31 AM ET: results, projections, short script
    - cron: "1 12 * * *"    # 8:01 AM ET
    - cron: "16 12 * * *"   # 8:16 AM ET
    - cron: "17 14 * * *"   # 10:17 AM ET
    - cron: "23 15-23 * * *" # every hour at :23 from 11:23 AM to 7:23 PM ET (GitHub often runs these late)
    - cron: "53 21,22,23 * * *" # extra runs near lock
    # Winter times (EST, UTC-5), the same Eastern times. The gate job skips these during summer time.
    - cron: "31 12 * * *"
    - cron: "1 13 * * *"
    - cron: "16 13 * * *"
    - cron: "17 15 * * *"
    - cron: "23 16-23,0 * * *"
    - cron: "53 22,23,0 * * *"
  workflow_dispatch:
  push:
    paths: [".github/workflows/projections.yml"]
permissions:
  contents: write
concurrency: projections
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        run: |
          S="${{ github.event.schedule }}"
          OFF=$(TZ=America/New_York date +%z)
          GO=true
          case "$S" in
            "31 11 * * *"|"1 12 * * *"|"16 12 * * *"|"17 14 * * *"|"23 15-23 * * *"|"53 21,22,23 * * *") [ "$OFF" = "-0400" ] || GO=false ;;
            "31 12 * * *"|"1 13 * * *"|"16 13 * * *"|"17 15 * * *"|"23 16-23,0 * * *"|"53 22,23,0 * * *") [ "$OFF" = "-0500" ] || GO=false ;;
          esac
          echo "schedule=$S offset=$OFF go=$GO"
          echo "go=$GO" >> "$GITHUB_OUTPUT"
  run:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install pillow highspy numpy
          command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null) || echo "poppler install failed"
      - name: Results from last night
        run: |
          python3 scripts/results.py || echo "results failed"
          python3 scripts/season.py || echo "season failed"
          python3 scripts/timelines.py || echo "timelines failed"
          python3 scripts/wowy.py || echo "wowy failed"
      - name: Projections and database
        run: |
          python3 scripts/official_injuries.py || echo "official injuries failed"
          python3 scripts/projections.py
          python3 scripts/stars.py
          python3 scripts/ownership.py || echo "ownership failed"
          python3 scripts/shorts.py
          python3 scripts/build.py
      - name: Commit
        run: |
          git config user.name "nascardataguy2"
          git config user.email "nascardataguy2@users.noreply.github.com"
          git add data ai.txt
          git diff --cached --quiet && exit 0
          git commit -q -m "Projections update"
          for i in 1 2 3; do
            if git pull --rebase -q && git push -q; then break; fi
            git rebase --abort 2>/dev/null || true
            git reset -q --hard origin/main
            (python3 scripts/official_injuries.py || true) && python3 scripts/projections.py && python3 scripts/stars.py && (python3 scripts/ownership.py || true) && python3 scripts/shorts.py && python3 scripts/build.py
            git add data ai.txt
            git diff --cached --quiet && exit 0
            git commit -q -m "Projections update"
          done
          for f in data/projections.json data/injury_report.json data/db.json data/shorts.txt data/shorts.json data/stars.json data/season.json data/gamelogs.json data/games/index.json data/wowy/index.json ai.txt; do curl -s "https://purge.jsdelivr.net/gh/nascardataguy2/nba-2026-27@main/$f" > /dev/null || true; done
